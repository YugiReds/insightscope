# Runs every test on each push and pull request to main. It needs NO secrets: the database is a throwaway Postgres
# started inside the job and filled with made-up data (tests/seed_ci_data.py), and the AI tests use a fake client.
# Each action is pinned to the full commit of a released version (the version is in the comment).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the older, unfinished run pointless, so it is cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0   # the same as NODE_VERSION in render.yaml
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm test

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-throwaway-password   # not a secret: this database lives only for this job
          POSTGRES_DB: insightscope_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-throwaway-password@localhost:5432/insightscope_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10   # the same as PYTHON_VERSION in render.yaml (a test checks this)
          cache: pip
      - run: pip install -r requirements.txt
      # The dashboard is built so the tests that serve the real build run instead of being skipped.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev && npm run build
        working-directory: frontend
      - name: Create the tables and load the made-up CI data
        run: python tests/seed_ci_data.py
      - run: python -m pytest
