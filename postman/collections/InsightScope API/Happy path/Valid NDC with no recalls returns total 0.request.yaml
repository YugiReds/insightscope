$kind: http-request
url: "{{baseUrl}}/products/99999-999/recalls"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('total is 0 and items is empty', function () {
          var body = pm.response.json();
          pm.expect(body.total).to.eql(0);
          pm.expect(body.items).to.be.empty;
      });
    language: text/javascript
order: 13000
