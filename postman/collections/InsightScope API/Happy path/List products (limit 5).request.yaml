$kind: http-request
url: "{{baseUrl}}/products?limit=5"
method: GET
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('items has 5 entries', function () {
          pm.expect(pm.response.json().items).to.have.lengthOf(5);
      });

      pm.test('total is a number', function () {
          pm.expect(pm.response.json().total).to.be.a('number');
      });
    language: text/javascript
order: 2000
