$kind: http-request
url: "{{baseUrl}}/recalls?classification=Class I&limit=5"
method: GET
queryParams:
  classification: Class I
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('every item is Class I', function () {
          var items = pm.response.json().items;
          pm.expect(items).to.not.be.empty;
          items.forEach(function (item) {
              pm.expect(item.classification).to.eql('Class I');
          });
      });
    language: text/javascript
order: 9000
