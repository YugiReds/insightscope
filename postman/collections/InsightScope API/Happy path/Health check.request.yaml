$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('status is ok', function () {
          pm.expect(pm.response.json().status).to.eql('ok');
      });
    language: text/javascript
order: 1000
