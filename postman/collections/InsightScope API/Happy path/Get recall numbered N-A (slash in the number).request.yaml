$kind: http-request
name: Get recall numbered N/A (slash in the number)
url: "{{baseUrl}}/recalls/N/A"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('recall_number is N/A and product_ndcs is a list', function () {
          var body = pm.response.json();
          pm.expect(body.recall_number).to.eql('N/A');
          pm.expect(body.product_ndcs).to.be.an('array');
      });
    language: text/javascript
order: 11000
