$kind: http-request
url: "{{baseUrl}}/recalls/D-0006-2027"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('has the right recall_number and a product_ndcs list', function () {
          var body = pm.response.json();
          pm.expect(body.recall_number).to.eql('D-0006-2027');
          pm.expect(body.product_ndcs).to.be.an('array');
      });
    language: text/javascript
order: 10000
