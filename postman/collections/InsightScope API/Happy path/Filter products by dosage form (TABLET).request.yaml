$kind: http-request
url: "{{baseUrl}}/products?dosage_form=TABLET&limit=5"
method: GET
queryParams:
  dosage_form: TABLET
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('every item has dosage_form TABLET', function () {
          var items = pm.response.json().items;
          pm.expect(items).to.not.be.empty;
          items.forEach(function (item) {
              pm.expect(item.dosage_form).to.eql('TABLET');
          });
      });
    language: text/javascript
order: 3000
