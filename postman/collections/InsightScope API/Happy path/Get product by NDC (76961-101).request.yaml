$kind: http-request
url: "{{baseUrl}}/products/76961-101"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('has active_ingredients and packages lists', function () {
          var body = pm.response.json();
          pm.expect(body.active_ingredients).to.be.an('array');
          pm.expect(body.packages).to.be.an('array');
      });
    language: text/javascript
order: 5000
