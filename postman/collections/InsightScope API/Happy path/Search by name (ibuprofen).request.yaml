$kind: http-request
url: "{{baseUrl}}/search?q=ibuprofen"
method: GET
queryParams:
  q: ibuprofen
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('response is a list', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 6000
