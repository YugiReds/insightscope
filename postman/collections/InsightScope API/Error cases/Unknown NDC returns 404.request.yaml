$kind: http-request
url: "{{baseUrl}}/products/0000-0000"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });

      pm.test('detail mentions the NDC', function () {
          pm.expect(pm.response.json().detail).to.include('0000-0000');
      });
    language: text/javascript
order: 1000
