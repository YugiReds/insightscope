$kind: http-request
url: "{{baseUrl}}/recalls/X-9999-9999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });

      pm.test('detail mentions the recall number', function () {
          pm.expect(pm.response.json().detail).to.include('X-9999-9999');
      });
    language: text/javascript
order: 4000
